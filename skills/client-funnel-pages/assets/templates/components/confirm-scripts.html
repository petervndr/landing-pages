  <!-- Fade sections in as they scroll into view (degrades gracefully without JS) -->
  <script>
  (function () {
    var els = document.querySelectorAll('.io');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
    }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  })();
  </script>
