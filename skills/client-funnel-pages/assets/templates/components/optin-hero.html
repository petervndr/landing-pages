  <!-- ═══ OPT-IN HERO — dark card, copy + form, 2 columns ═══ -->
  <section class="hero-wrap">
    <div class="hero-card">
      <div class="hero-inner optin-inner">

        <!-- LEFT: copy + CTA -->
        <div class="hero-copy">
          <span class="overline reveal" style="--cf-d:.05s">{{OPTIN_EYEBROW}}</span>
          <h1 class="reveal" style="--cf-d:.14s"><!--OPTIN_HEADLINE--></h1>
<!--OPTIN_SUB-->
<!--OPTIN_FINEPRINT-->
          <div class="cta-block reveal" style="--cf-d:.34s">
            <a class="cf-cta" href="#optin-form">
              {{OPTIN_CTA_TEXT}}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
<!--OPTIN_HERO_TRUST-->
          <!-- mobile-only lead-magnet mockup — deliberately BELOW the CTA + trust so it
               can never push the CTA under the fold (the exact bug template QC caught) -->
<!--OPTIN_HERO_IMG-->
        </div>

        <!-- RIGHT: opt-in form — native HTML (→ hidden GHL form) OR a Typeform embed -->
        <div class="optin-media reveal" style="--cf-d:.2s">
<!--OPTIN_FORM-->
        </div>

      </div>
    </div>
  </section>
